<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PixoraBot - Windows 截图工具</title>
<style>
body {
  margin: 0;
  font-family: "Microsoft YaHei", Arial, sans-serif;
  background: #f7f9fc;
  color: #202638;
  text-align: center;
}
header {
  padding: 24px;
  background: white;
  font-size: 24px;
  font-weight: bold;
}
main {
  padding: 100px 20px;
}
h1 {
  font-size: 44px;
}
p {
  color: #667085;
  line-height: 1.8;
}
.download {
  display: inline-block;
  background: #2563eb;
  color: white;
  padding: 15px 35px;
  border-radius: 10px;
  font-size: 17px;
  text-decoration: none;
  cursor: pointer;
}
.download:hover {
  background: #1d4ed8;
}
footer {
  padding: 30px;
  color: #98a2b3;
}
</style>
</head>
<body>

<header>PixoraBot</header>

<main>
  <h1>让截图更简单</h1>
  <p>轻量、快速、简洁的 Windows 截图工具</p>

  <a class="download"
     href="https://github.com/Jie-co/PixoraBot/releases/download/v2.0/PixoraBot.v2.0.exe">
    免费下载 Windows 版
  </a>
  <p id="download-count" role="status" aria-live="polite">下载次数加载中…</p>
</main>

<footer>© 2026 PixoraBot</footer>

<script>
(async function () {
  const label = document.getElementById('download-count');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch('https://api.github.com/repos/Jie-co/PixoraBot/releases/tags/v2.0', {
      headers: { Accept: 'application/vnd.github+json' }, signal: controller.signal
    });
    if (!response.ok) throw new Error('Statistics unavailable');
    const release = await response.json();
    const asset = release.assets.find(item => item.name === 'PixoraBot.v2.0.exe');
    if (!asset || !Number.isSafeInteger(asset.download_count) || asset.download_count < 0)
      throw new Error('Missing count');
    label.textContent = `当前版本已下载 ${asset.download_count.toLocaleString('zh-CN')} 次`;
  } catch (error) {
    label.textContent = '下载统计暂不可用，不影响下载';
  } finally { clearTimeout(timeout); }
})();
</script>
</body>
</html>
